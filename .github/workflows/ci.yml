name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the lockfile-compatible npm version
        run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
